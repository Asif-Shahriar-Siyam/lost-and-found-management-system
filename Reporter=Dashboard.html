<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporter — Dashboard</title>
</head>
<body>

    <header>
        <h1>REPORTER — DASHBOARD</h1>
        <h2>LOST &amp; FOUND</h2>
        <a href="#">Dashboard</a>
        <a href="#">Report Item</a>
        <a href="#">My Reports</a>
        <a href="#">Profile</a>
        <button>Logout</button>
    </header>

    <hr>

    <div class="welcome-section">
        <h2>Welcome, Rojan</h2>
        <p>Your reporting activity overview</p>
        <hr>
    </div>

    <div class="stats-overview">
        <div class="stat-box">
            <h3>6</h3>
            <p>TOTAL REPORTS</p>
        </div>

        <div class="stat-box">
            <h3>2</h3>
            <p>PENDING APPROVAL</p>
        </div>

        <div class="stat-box">
            <h3>4</h3>
            <p>APPROVED</p>
        </div>
    </div>

    <div class="recent-reports">
        <h3>RECENT REPORTS</h3>
        
        <table border="1">
            <thead>
                <tr>
                    <th>ITEM</th>
                    <th>TYPE</th>
                    <th>DATE</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Wireless Earphones</td>
                    <td>Found</td>
                    <td>10/08/2026</td>
                    <td><button>PENDING</button></td>
                </tr>
                <tr>
                    <td>Black Umbrella</td>
                    <td>Lost</td>
                    <td>05/08/2026</td>
                    <td><button>APPROVED</button></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
