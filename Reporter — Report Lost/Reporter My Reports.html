<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporter — My Reports</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <h1>REPORTER — MY REPORTS</h1>
        <h2>LOST &amp; FOUND</h2>
        <a href="#">Dashboard</a>
        <a href="#">Report Item</a>
        <a href="#">My Reports</a>
        <a href="#">Profile</a>
        <button>Logout</button>
    </header>

    <hr>

    <div class="my-reports-section">
        <h2>My Reports</h2>
        <hr>
        <p>Manage the items you've reported</p>

        <table border="1">
            <thead>
                <tr>
                    <th>ITEM</th>
                    <th>TYPE</th>
                    <th>DATE</th>
                    <th>STATUS</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Wireless Earphones</td>
                    <td>Found</td>
                    <td>10/08/2026</td>
                    <td><button>PENDING</button></td>
                    <td>
                        <a href="#">Edit</a> | <a href="#">Delete</a>
                    </td>
                </tr>
                <tr>
                    <td>Black Umbrella</td>
                    <td>Lost</td>
                    <td>05/08/2026</td>
                    <td><button class="approved">APPROVED</button></td>
                    <td>
                        <a href="#">Edit</a> | <a href="#">Delete</a>
                    </td>
                </tr>
                <tr>
                    <td>Power Bank (Anker)</td>
                    <td>Found</td>
                    <td>02/08/2026</td>
                    <td><button class="rejected">REJECTED</button></td>
                    <td>
                        <a href="#">Edit</a> | <a href="#">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
